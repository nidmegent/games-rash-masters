
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード図鑑 | Rash Masters</title>
  <link rel="stylesheet" href="css/collection.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<header class="topbar">
  <a href="home.html" class="logo">RASH <span>MASTERS</span></a>
  <nav>
    <a href="home.html">HOME</a>
    <a href="my-cards.html" class="active">CARDS</a>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <div class="eyebrow">RASH MASTERS COLLECTION</div>
    <h1>CARD <span>LIBRARY</span></h1>
    <p>未知なるカードを集め、あなただけのコレクションを作ろう。</p>

    <div class="collection-stats">
      <div class="stat">
        <small>登録カード</small>
        <strong id="totalCards">0</strong>
      </div>
      <div class="stat">
        <small>所持種類</small>
        <strong id="ownedKinds">0</strong>
      </div>
      <div class="stat">
        <small>所持総数</small>
        <strong id="ownedTotal">0</strong>
      </div>
    </div>
  </section>

  <section class="library">
    <div class="tabs">
      <button class="tab active" data-mode="all">ALL CARDS</button>
      <button class="tab" data-mode="owned">MY COLLECTION</button>
    </div>

    <div class="filters">
      <input id="searchInput" type="search" placeholder="カード名で検索...">
      <select id="rarityFilter">
        <option value="ALL">すべてのレアリティ</option>
        <option value="N">NORMAL</option>
        <option value="R">RARE</option>
        <option value="SR">SUPER RARE</option>
        <option value="SSR">SPECIAL SUPER RARE</option>
        <option value="UR">ULTRA RARE</option>
      </select>
    </div>

    <div class="result-info">
      <span id="resultCount">0 CARDS</span>
      <button id="reloadButton" class="reload-button">↻ 更新</button>
    </div>

    <div id="loading" class="message">カードデータを読み込み中...</div>
    <div id="cardGrid" class="card-grid"></div>
    <div id="emptyMessage" class="message hidden">
      該当するカードがありません。
    </div>
  </section>
</main>

<dialog id="cardModal" class="card-modal">
  <button id="closeModal" class="close-modal">×</button>
  <div id="modalContent"></div>
</dialog>

<div id="toast" class="toast"></div>

<script type="module" src="js/my-cards.js"></script>
</body>
</html>
