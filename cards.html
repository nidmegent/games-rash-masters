
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090914">
  <title>カード図鑑 | RASH MASTERS</title>
  <link rel="stylesheet" href="css/player-cards.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<header class="player-header">
  <a class="game-logo" href="home.html">
    <span class="logo-mark">R</span>
    <span>RASH MASTERS<small>CARD COLLECTION</small></span>
  </a>

  <nav>
    <a class="active" href="cards.html">カード図鑑</a>
    <a href="my-cards.html">マイカード</a>
    <a href="home.html">ホーム</a>
  </nav>

  <button id="logoutButton" class="logout-btn">ログアウト</button>
</header>

<main class="page-container">

  <section class="page-hero">
    <span class="eyebrow">THE WORLD OF RASH MASTERS</span>
    <h1>CARD <span>ENCYCLOPEDIA</span></h1>
    <p>この世界に存在するカードを確認しよう。</p>

    <div class="hero-stats">
      <div>
        <strong id="totalCards">0</strong>
        <span>登録カード数</span>
      </div>
      <div>
        <strong id="visibleCards">0</strong>
        <span>表示カード数</span>
      </div>
    </div>
  </section>

  <section class="filter-section">
    <input
      type="search"
      id="searchInput"
      placeholder="カード名を検索..."
    >

    <select id="rarityFilter">
      <option value="">全レアリティ</option>
      <option value="N">N</option>
      <option value="R">R</option>
      <option value="SR">SR</option>
      <option value="SSR">SSR</option>
      <option value="UR">UR</option>
    </select>

    <select id="typeFilter">
      <option value="">全タイプ</option>
      <option value="ATTACK">ATTACK</option>
      <option value="DEFENSE">DEFENSE</option>
      <option value="SUPPORT">SUPPORT</option>
      <option value="SPECIAL">SPECIAL</option>
    </select>
  </section>

  <div class="section-heading">
    <div>
      <span class="eyebrow">CARD DATABASE</span>
      <h2>ALL CARDS</h2>
    </div>
    <button id="refreshButton" class="outline-btn">↻ 更新</button>
  </div>

  <div id="cardGrid" class="card-grid">
    <div class="loading">カードを読み込んでいます...</div>
  </div>

</main>

<div id="cardModal" class="modal hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-content">
    <button id="closeModal" class="modal-close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="js/card-library.js"></script>
</body>
</html>
